<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReFlash Engine - WebAssembly Flash Runtime Test Harness</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --panel-bg: #242432;
            --accent-color: #00d2ff;
            --text-color: #f0f0f5;
            --border-color: #38384d;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        .canvas-container {
            background-color: #0f0f16;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            border-radius: 4px;
            background-color: #000;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #b0b0cc;
        }

        select, button {
            background-color: #161622;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        select:hover, button:hover {
            border-color: var(--accent-color);
        }

        button {
            background-color: #0088cc;
            font-weight: bold;
            border: none;
        }

        button:hover {
            background-color: #00aaff;
        }

        .stats-box {
            background-color: #161622;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>⚡ ReFlash Runtime - WebGL2 Flash Blend Modes Test Harness</h1>

    <div class="container">
        <div class="canvas-container">
            <canvas id="reflash-canvas" width="800" height="600"></canvas>
        </div>

        <div class="panel">
            <div class="control-group">
                <label for="blend-select">Flash Blend Mode</label>
                <select id="blend-select">
                    <option value="0">0: Normal (Alpha Blend)</option>
                    <option value="7">7: Add (Additive)</option>
                    <option value="2">2: Multiply</option>
                    <option value="3">3: Screen</option>
                    <option value="6">6: Difference / Invert</option>
                </select>
            </div>

            <div class="control-group">
                <label for="pattern-btn">Test Pattern Generator</label>
                <button id="pattern-btn">Cycle Test Patterns</button>
            </div>

            <div class="stats-box">
                <div class="stat-item">
                    <span>Engine Status:</span>
                    <span id="stat-status" class="stat-value">Initializing...</span>
                </div>
                <div class="stat-item">
                    <span>FPS:</span>
                    <span id="stat-fps" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span>Wasm Memory:</span>
                    <span id="stat-memory" class="stat-value">0 MB</span>
                </div>
            </div>
        </div>
    </div>

    <script src="shell.js"></script>
    <script src="reflash.js" async></script>
</body>
</html>
